<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#1F2937"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
    <linearGradient id="archGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8" stop-opacity="1"/>
      <stop offset="100%" style="stop-color:#818CF8" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" style="stop-color:#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgB)"/>

  <!-- Ambient glow -->
  <ellipse cx="512" cy="420" rx="320" ry="280" fill="url(#glowCenter)"/>

  <!-- Door frame outer -->
  <rect x="272" y="260" width="480" height="560" rx="20" fill="none" stroke="url(#archGlow)" stroke-width="6" opacity="0.5"/>

  <!-- Door frame arch top -->
  <path d="M 292 380 L 292 280 Q 292 260 312 260 L 712 260 Q 732 260 732 280 L 732 380" fill="none" stroke="url(#archGlow)" stroke-width="4" opacity="0.4"/>

  <!-- Door panel -->
  <rect x="302" y="300" width="420" height="500" rx="14" fill="url(#doorGrad)"/>

  <!-- Door arch detail -->
  <path d="M 322 400 L 322 316 Q 322 300 338 300 L 686 300 Q 702 300 702 316 L 702 400 Z" fill="#CBD5E1" opacity="0.6"/>

  <!-- Door panels decorative -->
  <rect x="326" y="420" width="170" height="140" rx="10" fill="none" stroke="#94A3B8" stroke-width="3" opacity="0.5"/>
  <rect x="528" y="420" width="170" height="140" rx="10" fill="none" stroke="#94A3B8" stroke-width="3" opacity="0.5"/>
  <rect x="326" y="580" width="170" height="100" rx="10" fill="none" stroke="#94A3B8" stroke-width="3" opacity="0.4"/>
  <rect x="528" y="580" width="170" height="100" rx="10" fill="none" stroke="#94A3B8" stroke-width="3" opacity="0.4"/>

  <!-- Door knob/handle -->
  <circle cx="630" cy="560" r="18" fill="#94A3B8"/>
  <circle cx="630" cy="560" r="10" fill="#64748B"/>

  <!-- Keyhole -->
  <circle cx="512" cy="545" r="22" fill="#94A3B8" opacity="0.5"/>
  <rect x="504" y="548" width="16" height="26" rx="4" fill="#94A3B8" opacity="0.5"/>

  <!-- Glowing light from door bottom -->
  <ellipse cx="512" cy="800" rx="200" ry="18" fill="#38BDF8" opacity="0.2"/>

  <!-- Steps -->
  <rect x="222" y="800" width="580" height="22" rx="6" fill="white" opacity="0.12"/>
  <rect x="192" y="822" width="640" height="18" rx="5" fill="white" opacity="0.08"/>

  <!-- Top stars / sparkles -->
  <circle cx="200" cy="200" r="5" fill="#38BDF8" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="820" cy="180" r="4" fill="#818CF8" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="160" cy="600" r="3" fill="#38BDF8" opacity="0.4"/>
  <circle cx="860" cy="500" r="4" fill="#818CF8" opacity="0.4"/>
  <circle cx="850" cy="300" r="3" fill="#38BDF8" opacity="0.5"/>

  <!-- Monogram top center -->
  <text x="512" y="230" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="64" font-weight="700" fill="url(#archGlow)" text-anchor="middle" letter-spacing="8">PROPOPS</text>
</svg>
