<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg2)"/>
  <!-- Decorative circle ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="url(#accent2)" stroke-width="6" opacity="0.3"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#accent2)" stroke-width="3" opacity="0.15"/>
  <!-- P letter -->
  <text x="200" y="660" font-family="Georgia, serif" font-size="480" font-weight="bold" fill="url(#accent2)" letter-spacing="-20">P</text>
  <!-- O letter overlapping -->
  <text x="420" y="660" font-family="Georgia, serif" font-size="480" font-weight="bold" fill="white" opacity="0.08" letter-spacing="-20">O</text>
  <text x="420" y="660" font-family="Georgia, serif" font-size="480" font-weight="bold" fill="none" stroke="url(#accent2)" stroke-width="8" letter-spacing="-20" opacity="0.9">O</text>
  <!-- Dot accent -->
  <circle cx="512" cy="830" r="22" fill="#38BDF8"/>
</svg>
