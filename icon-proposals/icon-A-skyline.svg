<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="60%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="buildingMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" style="stop-color:#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="buildingSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgA)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="700" x2="1024" y2="700" stroke="white" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="780" x2="1024" y2="780" stroke="white" stroke-width="1" opacity="0.05"/>

  <!-- Background building left -->
  <rect x="160" y="480" width="130" height="320" rx="8" fill="white" opacity="0.18"/>
  <!-- windows left building -->
  <rect x="178" y="506" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="222" y="506" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="178" y="546" width="30" height="24" rx="4" fill="white" opacity="0.3"/>
  <rect x="222" y="546" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="178" y="586" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="222" y="586" width="30" height="24" rx="4" fill="white" opacity="0.3"/>
  <rect x="178" y="626" width="30" height="24" rx="4" fill="white" opacity="0.3"/>
  <rect x="222" y="626" width="30" height="24" rx="4" fill="white" opacity="0.5"/>

  <!-- Background building right -->
  <rect x="734" y="430" width="130" height="370" rx="8" fill="white" opacity="0.18"/>
  <rect x="752" y="456" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="796" y="456" width="30" height="24" rx="4" fill="white" opacity="0.3"/>
  <rect x="752" y="496" width="30" height="24" rx="4" fill="white" opacity="0.3"/>
  <rect x="796" y="496" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="752" y="536" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="796" y="536" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="752" y="576" width="30" height="24" rx="4" fill="white" opacity="0.3"/>
  <rect x="796" y="576" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="752" y="616" width="30" height="24" rx="4" fill="white" opacity="0.5"/>
  <rect x="796" y="616" width="30" height="24" rx="4" fill="white" opacity="0.3"/>

  <!-- Main building center -->
  <rect x="347" y="310" width="330" height="490" rx="12" fill="url(#buildingMain)"/>

  <!-- Main building top detail -->
  <rect x="430" y="270" width="164" height="52" rx="8" fill="white" opacity="0.9"/>
  <rect x="494" y="230" width="36" height="50" rx="6" fill="white" opacity="0.75"/>

  <!-- Main building windows - grid -->
  <!-- Row 1 -->
  <rect x="378" y="342" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>
  <rect x="448" y="342" width="54" height="44" rx="6" fill="#2563EB" opacity="0.25"/>
  <rect x="518" y="342" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>
  <rect x="588" y="342" width="54" height="44" rx="6" fill="#2563EB" opacity="0.2"/>
  <!-- Row 2 -->
  <rect x="378" y="404" width="54" height="44" rx="6" fill="#2563EB" opacity="0.2"/>
  <rect x="448" y="404" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>
  <rect x="518" y="404" width="54" height="44" rx="6" fill="#2563EB" opacity="0.2"/>
  <rect x="588" y="404" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>
  <!-- Row 3 -->
  <rect x="378" y="466" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>
  <rect x="448" y="466" width="54" height="44" rx="6" fill="#2563EB" opacity="0.2"/>
  <rect x="518" y="466" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>
  <rect x="588" y="466" width="54" height="44" rx="6" fill="#2563EB" opacity="0.25"/>
  <!-- Row 4 -->
  <rect x="378" y="528" width="54" height="44" rx="6" fill="#2563EB" opacity="0.2"/>
  <rect x="448" y="528" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>
  <rect x="518" y="528" width="54" height="44" rx="6" fill="#2563EB" opacity="0.2"/>
  <rect x="588" y="528" width="54" height="44" rx="6" fill="#2563EB" opacity="0.35"/>

  <!-- Door -->
  <rect x="454" y="636" width="116" height="164" rx="10" fill="#1D4ED8" opacity="0.4"/>
  <circle cx="548" cy="720" r="10" fill="#1D4ED8" opacity="0.6"/>

  <!-- Ground line -->
  <rect x="100" y="795" width="824" height="6" rx="3" fill="white" opacity="0.2"/>

  <!-- Check badge bottom right -->
  <circle cx="768" cy="768" r="108" fill="#22C55E"/>
  <circle cx="768" cy="768" r="108" fill="none" stroke="white" stroke-width="10" opacity="0.3"/>
  <polyline points="716,768 752,804 828,722" fill="none" stroke="white" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
