<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="shapeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" style="stop-color:#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="shapeMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accentC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0ABFC"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgC)"/>

  <!-- Subtle texture overlay -->
  <rect width="1024" height="1024" rx="224" fill="white" opacity="0.03"/>

  <!-- Large P shape — built from rectangles for clean geometry -->
  <!-- Vertical stem of P -->
  <rect x="220" y="220" width="110" height="584" rx="16" fill="url(#shapeLight)"/>

  <!-- P bowl top horizontal -->
  <rect x="220" y="220" width="370" height="110" rx="16" fill="url(#shapeLight)"/>

  <!-- P bowl bottom horizontal -->
  <rect x="220" y="492" width="340" height="110" rx="16" fill="url(#shapeLight)"/>

  <!-- P bowl right vertical -->
  <rect x="480" y="220" width="110" height="382" rx="16" fill="url(#shapeLight)"/>

  <!-- Erase center of P bowl (make it hollow look) -->
  <rect x="330" y="330" width="152" height="162" rx="0" fill="url(#bgC)" opacity="0.85"/>

  <!-- Floating accent shapes - right side composition -->
  <!-- Large circle outline -->
  <circle cx="720" cy="480" r="170" fill="none" stroke="url(#accentC)" stroke-width="14" opacity="0.6"/>

  <!-- Inner circle -->
  <circle cx="720" cy="480" r="100" fill="url(#shapeMid)"/>

  <!-- Center dot -->
  <circle cx="720" cy="480" r="36" fill="url(#shapeLight)"/>

  <!-- Small decorative dots -->
  <circle cx="720" cy="260" r="16" fill="url(#accentC)" opacity="0.8"/>
  <circle cx="916" cy="480" r="12" fill="url(#accentC)" opacity="0.6"/>
  <circle cx="720" cy="700" r="16" fill="url(#accentC)" opacity="0.8"/>
  <circle cx="524" cy="480" r="12" fill="url(#accentC)" opacity="0.6"/>

  <!-- Bottom label strip -->
  <rect x="220" y="846" width="584" height="2" rx="1" fill="white" opacity="0.2"/>

  <!-- Small tag -->
  <text x="512" y="908" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="52" font-weight="600" fill="white" text-anchor="middle" opacity="0.55" letter-spacing="14">OPS</text>
</svg>
